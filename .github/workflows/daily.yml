name: 每日简报

on:
  schedule:
    # 北京时间 07:47（UTC 23:47）触发。GitHub 的定时任务整点最拥挤、常常延迟，
    # 提前十几分钟触发，消息通常在 8 点前后送达
    - cron: "47 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只生成预览，不发送到钉钉
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  # 生成并推送：能读到钉钉和大模型的密钥，但没有写仓库的权限
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 第一次运行时 state 分支还不存在，这一步会失败，程序按第一次运行处理
      - name: 读取去重状态
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: state
          path: .state
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.txt

      - name: 生成并推送简报
        run: python -m digest --state .state/state.json --archive-dir .state/archive
        env:
          PYTHONPATH: src
          # 手动运行时按勾选决定；定时运行时 inputs 为空，即正式发送
          DIGEST_DRY_RUN: ${{ inputs.dry_run }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # 三项都配置了才启用大模型，否则用原文标题和简介
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

      # 交给下一个任务提交。.state 本身是隐藏目录，默认会被整个跳过，
      # 所以要打开 include-hidden-files，再单独排除 checkout 留下的 .git
      - name: 上传去重状态和归档
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: state
          path: |
            .state/
            !.state/.git/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # 保存：只有这个任务能写仓库，而且只写 state 分支；这里不接触任何密钥，也不运行 Python 依赖
  save:
    needs: digest
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 取出 state 分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: state
          path: .state
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: state
          path: .state

      - name: 提交去重状态和归档
        run: scripts/save_state.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
