name: 每日简报
# Actions 页面上每次运行的名称标明触发方式（晚间版另外标出）。一天会有几路触发，
# 每一版推送的只有先到的那一次，其余的点进去 Summary 写着「已推送过，跳过」
run-name: >-
  ${{ format('每日简报{0} · {1}',
  inputs.edition == 'evening' && ' · 晚间' || '',
  github.event_name == 'schedule' && 'GitHub 兜底'
  || inputs.dry_run && '预览'
  || inputs.scheduled && '准点触发'
  || '手动推送') }}

# 准点推送靠外部定时服务（如 cron-job.org）每天 07:47 和 19:47 调用 workflow_dispatch，带 scheduled=true，
# 晚上那次再带 edition=evening，设置方法见 README「准点推送」。下面 GitHub 自带的定时任务只作兜底：
# 它不保证准点，负载高时会延迟几个小时（2026-10-04 的 07:47 晚了 3 小时才运行），严重时直接丢弃、不补跑。
# 几路触发同一天都会到达，每一版谁先到谁推送，后到的读到这一版今天已处理过就跳过
on:
  schedule:
    # 早间版。兜底触发属于哪一版按 cron 的钟点判断：北京时间 15 点及以后的是晚间版
    - cron: "47 23 * * *"  # 北京时间 07:47
    - cron: "37 0 * * *"   # 北京时间 08:37
    - cron: "37 1 * * *"   # 北京时间 09:37
    # 晚间版
    - cron: "47 11 * * *"  # 北京时间 19:47
    - cron: "37 12 * * *"  # 北京时间 20:37
    - cron: "37 13 * * *"  # 北京时间 21:37
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只生成预览，不发送到钉钉
        type: boolean
        default: true
      scheduled:
        description: 外部定时服务调用时用，手动运行不用勾：这一版今天已经推送过就跳过
        type: boolean
        default: false
      edition:
        description: 哪一版：morning 早间版，evening 晚间版
        type: choice
        options: [morning, evening]
        default: morning

permissions:
  contents: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  # 生成并推送：能读到钉钉和大模型的密钥，但没有写仓库的权限
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skipped: ${{ steps.digest.outputs.skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 第一次运行时 state 分支还不存在，这一步会失败，程序按第一次运行处理
      - name: 读取去重状态
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: state
          path: .state
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.txt

      - name: 生成并推送简报
        id: digest
        run: python -m digest --state .state/state.json --archive-dir .state/archive
        env:
          PYTHONPATH: src
          # 手动运行时按勾选决定；定时运行时 inputs 为空，即正式发送
          DIGEST_DRY_RUN: ${{ inputs.dry_run }}
          DIGEST_SCHEDULED: ${{ inputs.scheduled }}
          # 手动和外部定时服务触发时按 edition 决定哪一版；GitHub 自带的定时任务按 cron 的钟点判断
          DIGEST_EDITION: ${{ inputs.edition }}
          DIGEST_CRON: ${{ github.event.schedule }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # 三项都配置了才启用大模型，否则用原文标题和简介
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

      # 交给下一个任务提交。.state 本身是隐藏目录，默认会被整个跳过，
      # 所以要打开 include-hidden-files，再单独排除 checkout 留下的 .git。
      # 预览和「这一版今天已推送过」的跳过不会改动 state，不用上传
      - name: 上传去重状态和归档
        if: ${{ inputs.dry_run != true && steps.digest.outputs.skipped != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: state
          path: |
            .state/
            !.state/.git/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # 保存：只有这个任务能写仓库，而且只写 state 分支；这里不接触任何密钥，也不运行 Python 依赖
  save:
    needs: digest
    if: ${{ inputs.dry_run != true && needs.digest.outputs.skipped != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 取出 state 分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: state
          path: .state
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: state
          path: .state

      - name: 提交去重状态和归档
        run: scripts/save_state.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
