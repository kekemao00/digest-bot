# 兴趣画像：侧重领域只加分，不排除其他内容。
# 信息源本身已经偏 AI（实验室博客、HF 论文、GitHub Trending），所以加权保持温和。
# 关键词不区分大小写，按整词匹配英文、按子串匹配中文。

focus:
  - key: ai
    name: AI/LLM
    weight: 1.3
    keywords: [AI, LLM, LLMs, GPT, Claude, Gemini, Llama, Qwen, DeepSeek, Mistral,
               transformer, transformers, "language model", "neural network", agent, agents,
               "machine learning", "deep learning", inference, fine-tuning, RLHF, diffusion,
               OpenAI, Anthropic, DeepMind, embedding, embeddings, 大模型, 人工智能]
  - key: finance
    name: 金融
    weight: 1.3
    keywords: [finance, financial, bank, banks, banking, "central bank", "the Fed", "Federal Reserve", FOMC, "interest rate",
               "interest rates", inflation, bond, bonds, stock, stocks, equity, IPO, fintech,
               payments, crypto, bitcoin, stablecoin, SEC, 金融, 银行, 利率, 股市]
  - key: trading
    name: 交易
    weight: 1.3
    keywords: [trading, trader, traders, quant, quantitative, "market making", "order book",
               HFT, "high-frequency", hedge, "hedge fund", options, futures, derivatives,
               portfolio, backtest, backtesting, arbitrage, 交易, 量化]
  - key: security
    name: 安全
    weight: 1.3
    keywords: [CVE, vulnerability, vulnerabilities, exploit, exploits, exploitation, "zero-day", 0day,
               pentest, pentesting, "penetration testing", "red team", RCE, XSS, SSRF, CSRF, "SQL injection",
               "privilege escalation", "sandbox escape", "memory corruption", fuzzing, "reverse engineering",
               malware, ransomware, backdoor, CTF, 漏洞, 渗透, 提权, 逆向, 网络安全, 勒索]

# 防止信息茧房：每天至少这么多比例的名额留给侧重领域之外的高分内容
min_outside_focus: 0.34

# 保持视野：按大模型给的领域标签（AI、金融、软件、硬件、安全、科学、时政、社会、其他）约束当天的组成
diversity:
  # 单一领域最多占当天条数的比例（15 条时最多 6 条）；候选不够时不留空位
  max_topic_share: 0.4
  # 至少覆盖几个领域，“其他”不算
  min_topics: 4
  # 同一来源里同领域每多一条，排序分打这个折扣，避免一个来源连续推同一类内容
  topic_decay: 0.85
  # 单独限量的领域：每天最多几条，早晚两版合计。名额给大模型评分最高的几条，宁少勿滥，候选不够时也不放宽
  topic_limits:
    安全: 2
