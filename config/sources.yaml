# 简报整体设置、板块与信息源。改门槛和配额只需改这个文件。

digest:
  title: 每日简报
  timezone: Asia/Shanghai
  # 全天总条数上限；各板块上限之和可以超过它，名次靠后的自动让位
  max_items: 15
  # 完整版归档的地址前缀。留空时用本仓库 state 分支上的 archive/ 目录，
  # 即 https://github.com/<仓库>/blob/state/archive/YYYY/MM-DD.md
  archive_base_url: ""

# 板块按这里的顺序出现在消息里；icon 显示在板块标题前
# 各板块上限之和（18）大于全天总数（15），名次靠后的自动让位
sections:
  - {key: world, name: 世界与财经, icon: 🌍, limit: 3}
  - {key: tech, name: 科技热议, icon: 🗞️, limit: 5}
  - {key: labs, name: 实验室动态, icon: 🧪, limit: 2}
  - {key: papers, name: 论文, icon: 📄, limit: 3}
  - {key: journals, name: 期刊与科学, icon: 📚, limit: 3}
  - {key: oss, name: 开源项目, icon: 🛠️, limit: 2}

# 信息源。顺序有意义：同一内容出现在多个来源时，保留靠前的那个，其他的显示为“另见”。
# 通用字段：
#   section       所属板块
#   weight        同板块多个来源交替排列时的权重，默认 1，越大越靠前
#   max_items     本来源每天最多入选几条
#   exclude_title 标题命中这个正则就丢弃
#   enabled       false 时停用
sources:
  # ---- 世界与财经 ----
  # 平衡技术类来源的视角：国际时事、央行与经济数据、深度评论、中文媒体
  - id: bbc-world
    type: feed
    name: BBC
    section: world
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    window_hours: 36
    # 按编辑排序：越靠前越重要
    rank: order
    max_items: 1

  - id: aljazeera
    type: feed
    name: Al Jazeera
    section: world
    url: https://www.aljazeera.com/xml/rss/all.xml
    window_hours: 36
    # 只要新闻、专题和经济报道，不要体育和直播
    link_pattern: "aljazeera\\.com/(news|features|economy)/"
    exclude_title: "(?i)^live\\b"
    max_items: 1
    weight: 0.6

  - id: fed
    type: feed
    name: 美联储
    section: world
    url: https://www.federalreserve.gov/feeds/press_all.xml
    window_hours: 36
    # 只要货币政策和监管政策，不要单家银行的审批和处罚
    exclude_title: "(?i)approval of application|enforcement action|comment period|announces (the )?(appointment|retirement)"
    max_items: 1

  - id: cnbc-economy
    type: feed
    name: CNBC
    section: world
    url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258
    window_hours: 36
    max_items: 1

  - id: economist
    type: feed
    name: 经济学人
    section: world
    url: https://www.economist.com/finance-and-economics/rss.xml
    # 周刊，每周四更新
    window_hours: 168
    max_items: 1
    weight: 0.8

  - id: ftchinese
    type: feed
    name: FT中文网
    section: world
    url: https://www.ftchinese.com/rss/news
    window_hours: 48
    max_items: 1
    weight: 0.6

  # ---- 科技热议 ----
  - id: hn
    type: hackernews
    name: HN
    section: tech
    window_hours: 30
    # 满足任一条件即可入选
    min_points: 200
    min_comments: 100

  - id: lobsters
    type: lobsters
    section: tech
    window_hours: 30
    min_score: 20
    # HN 的量大得多，Lobsters 的第一条大约排在 HN 第二、三条之后
    weight: 0.4

  # ---- 实验室动态 ----
  # 有 RSS 的用 feed；没有 RSS 的用 page：比较列表页，新出现的文章才算
  - id: openai
    type: feed
    name: OpenAI
    section: labs
    url: https://openai.com/news/rss.xml
    max_items: 1
    # 客户案例不算实验室动态
    exclude_title: "(?i)\\bwith OpenAI$|\\bscales\\b.*\\bOpenAI\\b"

  - id: anthropic
    type: page
    name: Anthropic
    section: labs
    url: https://www.anthropic.com/news
    link_pattern: "^https://www\\.anthropic\\.com/news/[a-z0-9-]+$"
    max_items: 1
    exclude_title: "(?i)\\bscales Claude\\b"

  - id: deepmind
    type: feed
    name: Google DeepMind
    section: labs
    url: https://deepmind.google/blog/rss.xml
    max_items: 1

  - id: google-research
    type: feed
    name: Google Research
    section: labs
    url: https://research.google/blog/rss/
    max_items: 1
    weight: 0.8

  - id: meta-ai
    type: page
    name: Meta AI
    section: labs
    url: https://ai.meta.com/blog/
    link_pattern: "^https://ai\\.meta\\.com/blog/[a-z0-9-]+/?$"
    max_items: 1

  - id: microsoft-research
    type: feed
    name: Microsoft Research
    section: labs
    url: https://www.microsoft.com/en-us/research/feed/
    max_items: 1
    weight: 0.8

  - id: apple-ml
    type: feed
    name: Apple ML
    section: labs
    url: https://machinelearning.apple.com/rss.xml
    max_items: 1
    weight: 0.6

  - id: deepseek
    type: page
    name: DeepSeek
    section: labs
    url: https://api-docs.deepseek.com/news/news250120
    link_pattern: "^https://api-docs\\.deepseek\\.com/news/news\\d+$"
    max_items: 1

  - id: mistral
    type: page
    name: Mistral AI
    section: labs
    url: https://mistral.ai/news
    link_pattern: "^https://mistral\\.ai/news/[a-z0-9-]+/?$"
    max_items: 1
    weight: 0.8

  - id: hf-blog
    type: feed
    name: Hugging Face 博客
    section: labs
    url: https://huggingface.co/blog/feed.xml
    # 社区投稿很多，只取一条且排在后面
    max_items: 1
    weight: 0.4

  # ---- 论文 ----
  - id: hf-papers
    type: hf_daily_papers
    section: papers
    min_upvotes: 20

  - id: arxiv-qfin
    type: feed
    name: arXiv
    section: papers
    # 量化金融：交易与市场微观结构、统计金融、投资组合管理
    url: https://export.arxiv.org/api/query?search_query=cat:q-fin.TR+OR+cat:q-fin.ST+OR+cat:q-fin.PM&sortBy=submittedDate&sortOrder=descending&max_results=50
    window_hours: 72
    # 没有热度数据，每天只取一篇（命中“交易”等侧重领域的优先），第三阶段改由大模型挑选
    max_items: 1

  # ---- 期刊 ----
  # 只要研究论文：撤稿、更正等声明一律排除
  # Nature 系列的文章编号以 s 开头的是研究论文，以 d 开头的是新闻和评论
  - id: nature
    type: feed
    name: Nature
    section: journals
    url: https://www.nature.com/nature.rss
    link_pattern: "/articles/s4"
    exclude_title: &notices "(?i)^(retraction|correction|author correction|publisher correction|addendum|erratum|editorial expression of concern)\\b"
    max_items: 2

  - id: nature-mi
    type: feed
    name: Nature Machine Intelligence
    section: journals
    url: https://www.nature.com/natmachintell.rss
    link_pattern: "/articles/s4"
    exclude_title: *notices
    max_items: 1
    weight: 0.6

  # Science 的订阅源是整期目录，含新闻和观点；按页数只留研究论文（在线论文页码以 e 开头）
  - id: science
    type: feed
    name: Science
    section: journals
    url: https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=science
    exclude_title: *notices
    min_pages: 3
    max_items: 2

  # Cell 和 PNAS 的官方订阅源拦截自动请求，改用 Crossref 按 ISSN 查询
  - id: cell
    type: crossref
    name: Cell
    section: journals
    issn: 0092-8674
    exclude_title: *notices
    max_items: 1
    weight: 0.6

  - id: pnas
    type: crossref
    name: PNAS
    section: journals
    issn: 0027-8424
    # PNAS 每周发表上百篇，只要有摘要的研究论文，且排在最后
    require_abstract: true
    exclude_title: *notices
    max_items: 1
    weight: 0.4

  # 通俗但严谨的数学、物理、生物深度报道
  - id: quanta
    type: feed
    name: Quanta
    section: journals
    url: https://www.quantamagazine.org/feed/
    max_items: 1
    weight: 0.8

  # ---- 开源项目 ----
  - id: github-trending
    type: github_trending
    section: oss
    min_stars_today: 300
